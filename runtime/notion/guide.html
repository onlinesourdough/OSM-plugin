Notion is the shared workspace for this foundation. Use AI to organize what matters, keep it current and put it to work across your business. Your existing systems retain their originals.

<callout icon="\u{1F9ED}" color="brown_bg">
<b>Give this guide to your agent.</b> Read the method here, then follow <mention url="https://app.notion.com/p/40d6d2e17f56812bb597fef2bdc1265d">Setup & tools</mention> for setup/adoption. Use the owner's actual Data & Context entry and selected policy for private routes and authority. Use the relevant guide page and the skills supplied with your installed plugin. A guide or downloaded skill is not an installed setup.

## Architecture

<embed source="notion-file-block://41d6d2e1-7f56-817e-aa65-d3684c34152b/f07bdb9f-92ae-4513-a67b-310b5009493b?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=osm-architecture.html" />

Prime finds useful context. Log saves lasting decisions and corrections. Dreaming maintains that context between sessions. See <mention url="https://app.notion.com/p/40d6d2e17f568113a397fb6ecd9b5fff">Architecture diagram</mention> for the detailed relationships.

## Start with the foundation

<columns>
<column ratio="50">
### Data

The material your business works with: records, documents, messages, recordings and evidence from real work.
</column>
<column ratio="50">
### Context

What matters and how you work: goals, customers, offers, decisions, relationships, voice and working preferences.

Skills are reusable ways of working within that context.
</column>
</columns>

Notion makes selected Knowledge, Memory and Skills findable together and links to the relevant originals. A database organizes material; it is not a separate conceptual pillar.

## Put the foundation to work

Use the methods a task needs: understand the situation, define the outcome, do the work, review and deliver it. Keep your own judgement, tools and working habits. Small requests stay small.

As the business changes, revise the current explanation where it belongs. Keep meaningful history separately. Relevance, accepted decisions and source quality guide retrieval; a recent edit alone does not make a page more useful.

## Methods and skills

Shared OSM instructions help you establish and maintain the foundation and complete useful work. Personal skills adapt methods to your own business. Both belong to the context you give an assistant.

<database url="https://app.notion.com/p/6abfc738a9604ddc806432721813712b" data-source-url="collection://6ff724a0-558c-4845-a0e1-a2e7fab86642" inline="false">
OSM Skills
</database>

The installed plugin contains the shared skills and their supporting instructions. Your own Notion Data & Context home holds the business definition, Knowledge, Memory and personal Skills.

## \u{1F9E9} Extensions

<callout icon="\u{1F9E9}" color="brown_bg">
<b>Content \xB7 optional extension.</b> A separate content method with its own [OSM Content repository](https://github.com/onlinesourdough/OSM-content), setup/database contract, configuration guide and five adaptable skill templates. Use the Content page below as the human and agent entry. Keep your creative process and private configuration in your own foundation. Content is outside the OSM plugin; it is not installed with OSM.
</callout>

<p />`,source_last_edited:"2026-11-19T21:05:06.816Z"},"40d6d2e17f56811885ced64930bb22ba":{id:"40d6d2e17f56811885ced64930bb22ba",title:"OSM definition",url:"https://gustavanderson.notion.site/40d6d2e17f56811885ced64930bb22ba",body:`OSM is an AI-assisted method for solo founders and small teams to make business data and context useful to AI. The reference setup uses Notion as a shared workspace for the foundation.

## Two parts of one foundation

Data is the material: records, documents, messages, recordings and evidence in the systems where they live.

Context gives it meaning and direction: goals, customers, offers, decisions, relationships, voice, constraints and working preferences. Skills belong inside context; they describe reusable ways of carrying out work.

Knowledge, Memory, Skills and an optional Content collection are storage responsibilities. They organize data and interpreted context; they do not add more conceptual pillars.

## What each place owns

| Place | Responsibility |
| --- | --- |
| Shared context home | Maintained knowledge, goals, interpreted decisions, selected configuration and reusable methods. |
| Operational systems | Actual customer, financial, project and other live records. |
| Project or production workspace | Relevant sources, accepted scope, working files and reviewed results. |
| AI app | Models, tools, access, execution environment and native scheduling. |

Notion is the supported context home. Setup reuses suitable existing pages and databases. A route identifies a source; the selected account or connection supplies access.

## Shared method, personal configuration

OSM helps establish and maintain the foundation and apply the methods needed for the task. Your goals, taste, tools, voice and working rhythm remain your own context.

Content is an optional extension. It reuses or establishes an editorial collection and adds production responsibilities when selected. An existing human or assisted content workflow can stay.

## Current explanation and history

Maintain one coherent current topic for each scope. Accepted corrections revise its explanation and Summary in place. Keep useful previous decisions and reasons in clearly marked history, reached when needed. Create another topic when it has an independent purpose or lifecycle.

Select relevant material by scope and task, accepted authority and comparable source freshness. Technical last-edited time is not confirmation that a fact is current.

## Your own Data & Context

Your own Data & Context home holds your company's selected configuration and knowledge. Setup adapts the shared template to that home. Follow <mention url="https://app.notion.com/p/40d6d2e17f56812bb597fef2bdc1265d">Setup & tools</mention> for first use and <mention url="https://app.notion.com/p/40d6d2e17f56816da06ff15c39dcc038">Data & context</mention> for the definition and database fields.`,source_last_edited:"2026-11-19T21:05:07.719Z"},"40d6d2e17f56812bb597fef2bdc1265d":{id:"40d6d2e17f56812bb597fef2bdc1265d",title:"Setup & tools",url:"https://gustavanderson.notion.site/40d6d2e17f56812bb597fef2bdc1265d",body:`Use AI to establish a shared data and context foundation for the way your business works. Notion is OSM's supported context home.

Use the Setup skill included with your installed OSM plugin. It guides the conversation and opens supporting instructions when needed.

## Establish the foundation

Find the relevant existing material and decide what should be maintained as shared context. Reuse suitable originals and verified connections. Organize current knowledge, meaningful decisions and personal methods so the next assistant can find them.

Give each topic a clear owner, scope and stable identity. Record source dates and uncertainty where they matter. Keep the current explanation concise, with history behind a separate reference.

Setup supports Notion as the context home. Legacy folder or vault homes are recognized read-only; Setup offers no new file or vault home. Existing projects keep their own sources, standards and working files.

## Use the methods and tools you need

The AI app supplies its models, tools, access and execution environment. Choose the shared methods that help the task and adapt personal skills to your own business. Skills are part of the context, not an extra foundation beside data and context.

Reading instructions, installing a package, connecting an account and proving it works are different steps. Verify the relevant access and a useful first result in the actual environment.

## Install and use OSM

[Install OSM](https://github.com/onlinesourdough/OSM-plugin#install-in-your-app) \xB7 [Workspace setup](https://github.com/onlinesourdough/OSM-plugin/blob/main/docs/native-installation.md#start-with-a-clean-agent-workspace)

### Set up through a conversation

1. Install OSM in your agent app, open a fresh chat and ask it to run OSM Setup.
2. Have Setup check whether the official Notion plugin is installed and connected. Install and connect it when needed, then verify the intended account and a page you can read.
3. Describe your business and choose a useful first task. Setup reuses suitable existing pages and databases, then helps build your Data & Context home with the definition below and Knowledge, Memory and Skills. The home starts with its definition, followed by the databases.
4. Let Setup adapt the definition and database properties to your business, record where source data lives and establish the short instructions for your agent app.
5. Complete the first task, save one lasting decision through Log, and ask for that decision and its source in a fresh chat. Add daily Dreaming when useful.

Use the official Notion plugin with a person's authorized account for ordinary work. Select a dedicated connection when a team workflow, delegated worker or unattended job needs a separate identity or a narrower scope. Each person can have their own authorized account. Being a team member alone does not require a new integration. Store credentials in the host or provider credential store.

Prime starts a session with relevant context. Log saves lasting changes at checkpoints. Dreaming reviews recent work and maintains context between sessions. Council brings in another agent for review or bounded work.

### Data & Context definition template

Use the definition and database guidance in <mention url="https://app.notion.com/p/40d6d2e17f56816da06ff15c39dcc038">Data & context</mention>. Setup adapts that template to the company's actual sources and existing databases.

Replace the placeholders with identities and routes that have actually been verified. Store credential values in the host or provider credential store.

The reference library preserves tagged instructions and supporting source packets. It does not report a visitor's private installed version.

## Add Content when useful

The optional Content companion helps adapt the foundation to an existing creative workflow and build personal content skills. Reuse the person's editor, publishing tools and ways of working. Its examples can include Notion for editorial work and a newsletter service for delivery. Choose tools for the actual task and verify the relevant integration before using it.

## Choose the Notion access that fits

| Situation | Useful route |
| --- | --- |
| You use your own Notion account | Connect the official Notion plugin in the agent app and verify the selected workspace. |
| A teammate already has access to shared pages | They connect their own authorized account. Shared pages and database permissions determine access. |
| A worker or job needs access to selected pages only | Use a dedicated connection with its own identity and share only the required root and any separately stored sources. |
| An unattended daily Dreaming job | Select a route that can authenticate in that job's actual runtime. Verify it can read and make the authorized changes without the owner being present. |
| You work for several clients | Select the appropriate client's home, account and permissions for the task. Keep each client's context in its own home. |
| A connection fails or is revoked | Report the affected source and restore the selected connection. A different connected account is a separate choice. |

A scoped connection limits the pages available through that connection. An agent that can also call a broader account still has that other route. When a workflow needs a technical boundary, configure its actual tools and credentials to match that boundary. Database views and labels help retrieval; Notion sharing controls access.

## Add a provider API key when needed

Start with an existing supported plugin or connection. Add an API key when the chosen tool actually needs one, such as a separate research provider or a dedicated integration. Put it in the host or provider credential store and keep only the provider, account, purpose and secret reference in the definition. Test a small authorized request and the route used by a scheduled job when applicable. Document rotation and revocation alongside that connection.

An API key is an authentication credential. Notion remains the context home. External provider records and data stay in the provider's system. A local project can use an ignored environment file when its supported runtime requires it; persistent personal or scheduled credentials should use the runtime's supported secret storage.

## Agent workspace and tools

Use the host's built-in workspace and tools first, including its browser, terminal and side panel when available. Use external apps when the built-in tools cannot do the work. Keep the same short context pointer in the selected host's instructions, with Prime at session start and Log at meaningful checkpoints or on request.

Full access, action approvals and computer use are host settings. Choose them for the intended task and workspace and verify the effective tools and permissions. [Host setup for Codex, Claude Code, Antigravity, Cursor and Pi](https://github.com/onlinesourdough/OSM-plugin/blob/main/docs/native-installation.md#start-with-a-clean-agent-workspace)`,source_last_edited:"2026-11-19T20:56:22.768Z"},"40d6d2e17f56816da06ff15c39dcc038":{id:"40d6d2e17f56816da06ff15c39dcc038",title:"Data & context",url:"https://gustavanderson.notion.site/40d6d2e17f56816da06ff15c39dcc038",body:`The foundation consists of data and context. Skills are part of context: reusable ways to do the work. The reference setup organizes both in Notion while keeping operational originals with their owners.

## Storage responsibilities

| Store | Purpose |
| --- | --- |
| Knowledge | Current explanations, goals, audiences, offers, positioning and selected configuration. |
| Memory | Durable decisions, preferences and lessons, with dated reasons and attribution. |
| Skills | Personal or shared ways of working, with their source and selected revision. |
| Content, when selected | Sources, ideas, actual material, channel editions and observed response. |

These are organizational choices, not new pillars. A database may contain evidence and interpreted meaning. A view is a way to find records, not an access boundary.

## Create and revise

Find the existing topic, stable identity and scope before creating anything. Accepted new information about the same topic updates the current explanation and Summary. Add genuinely new detail in its proper section.

Create a new record for an independent topic, purpose, scope or lifecycle. A different author alone does not create a new meaning. Split a topic when parts need different maintenance. Preserve original human material and meaningful earlier decisions; clearly historical pages are read when a question needs their reasons or past state.

## Metadata that helps

| Signal | What it means |
| --- | --- |
| Identity, role and scope | Which topic this is, what it owns and where it applies. |
| Status and provenance | What is selected, uncertain, replaced or attributed to a source. |
| Source/evidence time | When the event, observation or source belongs. |
| Revised | When the current record changed in substance. Carried-forward facts may not have been rechecked. |
| Review due | A justified point for reconsidering something temporary or changeable. |

These optional revision/review fields can be mapped to a Notion home. Source, import, publication, processing and released-version dates retain their different meanings. Plain pages can carry a short role, status and revision in their body. An unknown date stays unknown; there is no automatic mass backfill.

## Relevant first, then comparable freshness

Use the current task and selected owner controls, scope, topic and Summary to find useful material. Consider accepted authority and source quality before comparing evidence age. An older current decision can be more relevant than a new suggestion.

A due/flagged view helps identify review candidates. It does not declare their content false. A mechanical edit or a global recency score cannot determine a future task's relevance.

## Keep the foundation useful

Maintain useful new information, source changes and real review signals. Read before editing, make the smallest coherent update and verify it. A run with no useful change leaves content and revision dates alone.

Keep private context and customer material in their chosen home. This guide contains generic methods and reference material; using it does not require making your own foundation public.

## Data & Context home template

A new private home starts with its Data and Context Definition, followed by the Knowledge, Memory and Skills databases. Setup fills the definition from the company's actual sources and verified destinations. Its own onboarding explanations stay in the conversation. An optional Content database is added only when selected.

\`\`\`yaml
definition:
  version: 1
  root:
    id: "[exact root page ID]"
    account: "[verified Notion workspace or connection binding]"
    title: "[exact root title]"
    role: data-and-context-root
    purpose: "[whose context this is and what it is used for]"
  contract: osm-context-architecture  # plugin reference; not copied here
  destinations:  # native children, and any other store this home names, by exact ID; labels are the owner's
    knowledge: {label: "Knowledge", id: "[id]"}
    memory: {id: "[id]"}
    skills: {id: "[id]"}
    maintenance: {id: "[id]"}  # pipeline agreements and other control records
    content: {id: "[id]"}  # optional; only when the owner selects Content
  # The owner's recorded choice. Setup proposes whole-home and never assumes it.
  write_policy: {choice: "[whole-home | narrower | not yet chosen]", include: ["[exact identities; narrower only]"], exclude: ["[exact identities]"], recorded: "[owner decision source and date]"}
  controls:
    operating_policy: "[exact policy ID, when a separate page is required]"
    checkpoints: {kind: "[notion-record | runtime-binding]", ref: "[exact existing checkpoint reference for scheduled upkeep]"}
  areas:
    business-and-relationships: {coverage: "[source keys or gap]"}
    work-and-knowledge: {coverage: "[source keys or gap]"}
    communication: {coverage: "[source keys or gap]"}
    finance: {coverage: "[source keys, gap or deferred]"}
    products-market-operations: {coverage: "[source keys or gap]"}
  sources:
    - key: "[stable source key]"
      area: "[area]"
      provider: "[provider]"
      account: "[exact account or workspace identity, or its verified reference]"
      scope: "[selected objects, or a deliberately broader account/workspace-visible scope, by identity]"
      lifecycle: "[current-recurring | historical-one-off | deferred | excluded]"
      placement: "[direct | projection | both]"
      reader: "[route that reads it, or none]"
      agreement: "[exact pipeline agreement ID; required for recurring work]"
      # Readiness is observed state, kept in progress records, never here.
  references:
    - "[deeper domain contract or supporting page by ID]"
\`\`\`

Setup replaces placeholders with verified page and database identities and adapts the routes to the business. The definition points to the original CRM, finance and other systems, with the selected account, scope and permitted use. Credentials stay in the provider or host credential store.

## Database fields

| Store | Useful starting properties | Content |
| --- | --- | --- |
| Knowledge | Title, Summary, Kind, Space or scope, Status, Key, Source and relevant source dates | Current business knowledge, including the person or business, offers, customers, voice, strategy, relevant numbers, team and source map. |
| Memory | Title, scope, Status, Key, Source and known source date | Lasting decisions, corrections and reasons, including what they supersede when relevant. |
| Skills | Name, Description, supporting files, scope, Status, Owner and Source | Personal or team methods, with their applicable version and permissions. |

Reuse native database types and suitable existing properties. Add a relation only when its meaning and evidence are clear. Review due and substantive revision dates are useful when they change retrieval or maintenance. A label, view or team audience does not grant access. Source dates describe the source; editing or importing a record is a different event.

## How the three context skills use this home

Prime reads the definition and relevant sources at session start. Log saves supported lasting changes at meaningful checkpoints or when asked. Dreaming reviews recent work, unfinished progress and selected connected sources, consolidates useful context and repairs verified drift. Each follows the selected home, account and write authority.`,source_last_edited:"2026-11-19T20:53:26.794Z"},"40d6d2e17f56815eaf53cab824a40eb3":{id:"40d6d2e17f56815eaf53cab824a40eb3",title:"Work & evaluation",url:"https://gustavanderson.notion.site/40d6d2e17f56815eaf53cab824a40eb3",body:`OSM helps work move from an understood need to a useful, checked result.

## Use the depth the work needs

A small question or text correction can stay small. Substantive work benefits from a clear outcome, relevant sources, a plan where useful, implementation and review.

| Part | Useful question |
| --- | --- |
| Understand | What is the person trying to achieve, and what is still materially unclear? |
| Define | What result is accepted, what evidence will assess it, and where does the work belong? |
| Do | What needs to be created, changed or investigated? |
| Review | Does the actual result meet the accepted outcome? |
| Deliver | Has the selected destination received the reviewed result under the applicable authority? |
| Learn | Which useful decision or correction should remain findable next time? |

Reuse decisions and evidence already present. Do not make the owner repeat discovery or force every task through a full ceremony.

## Judge the actual result

The proof depends on the work. Read the final text in its intended format. See and hear an exported video. Exercise an application interaction. Reconcile a report against its sources. A valid file or successful tool call alone may not prove the result is useful.

Draft, ready, scheduled and actually delivered are different states. An uncertain send or write should be checked before retrying.

## Evaluate what the goal calls for

For content, views can help diagnose distribution. They do not by themselves establish audience fit, trust or commercial value.

Keep concrete observations with the actual edition and measurement window. Use them to choose a bounded next experiment; avoid causal claims from a single post.

## Choose specialists when needed

Use an appropriate specialist or separately maintained system for the accepted work. Agentic Systems can support engineering projects. The optional Content companion can support editorial production. Neither needs to replace the owner's own process.`,source_last_edited:"2026-11-06T12:00:03.341Z"},"40d6d2e17f56818bb90ecdc2bf6397ce":{id:"40d6d2e17f56818bb90ecdc2bf6397ce",title:"Automations & upkeep",url:"https://gustavanderson.notion.site/40d6d2e17f56818bb90ecdc2bf6397ce",body:`A maintained foundation helps assistants build on useful knowledge as the business changes.

## One current topic, meaningful history

Find the existing topic by identity, scope and meaning. Update its affected explanation and Summary when accepted information changes. Preserve original sources and material earlier reasons in clearly marked history, rather than adding contradictory updates to the current body.

A new topic needs an independent purpose or lifecycle. A new message or revision date is not enough.

## Freshness and relevance

Use task relevance, selected authority and source quality alongside comparable evidence dates. Revised means a substantive record change; it does not mean all facts were reverified. Review due is a real reconsideration point, not an automatic expiry.

Inspect useful new input, supported route changes and due/flagged items. Preserve uncertainty and pending choices. No useful change means no rewrite or revision stamp.

## Choose recurring work explicitly

An automation needs a purpose, source scope, destination, action authority, runtime, limits and a useful failure/pending policy. A skill does not start a timer or make its host available continuously.

Context upkeep maintains the selected foundation across its actual descendants. It can include an existing Content collection even when the owner uses a different production workflow.

## Content responsibilities stay distinct

Idea capture, production, distribution and Content Learn are separate choices. They can be manual, assisted or explicitly scheduled. Learn interprets editorial response against the chosen goals; it does not replace foundation upkeep.

## Prime, Log and Dreaming

Prime starts the session by reading the selected definition and the context relevant to the task. Log captures supported lasting changes when meaningful work finishes or you ask it to save a decision. You can simply say \u201Cremember this decision\u201D or \u201Clog this\u201D; a slash command is optional.

Dreaming reviews work between sessions through a selected daily schedule. It includes completed work, useful progress in unfinished work and recently archived sessions when the selected history source supports them. It also checks connected sources named in the definition when there is a relevant change or a check is due. This can include a CRM, accounting system, project tracker or editorial source.

Dreaming reconciles that evidence with the existing Knowledge, Memory and Skills. It can correct a verified Prime or Log error, combine duplicate context, mark a decision that was superseded and repair a supported source route. It preserves the reasons and source dates that matter. A repeated unchanged run adds no duplicate record and makes no content rewrite.

Run the whole selected review under the recorded access and write policy. Unavailable evidence and unresolved choices are reported while independent checks continue. A recent edit alone does not make a fact more authoritative, and an old decision can remain current.`,source_last_edited:"2026-11-19T21:11:11.512Z"},"40d6d2e17f568113a397fb6ecd9b5fff":{id:"40d6d2e17f568113a397fb6ecd9b5fff",title:"Architecture diagram",url:"https://gustavanderson.notion.site/40d6d2e17f568113a397fb6ecd9b5fff",body:`## How OSM works

Your agent uses OSM to find relevant business context, save useful learning and keep that context current. The diagram shows the seven skills, your Notion Data & Context home and the connected sources.

<embed source="notion-file-block://41d6d2e1-7f56-81ed-bf06-f3a23020d242/f07bdb9f-92ae-4513-a67b-310b5009493b?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=osm-architecture.html" />

### The working relationships

\`\`\`mermaid
flowchart LR
  HOME["Notion \xB7 Data & Context<br/>Definition, Knowledge, Memory, Skills"]
  SOURCES["Original sources<br/>Project files, CRM, finance, work history"]
  PRIME["Prime"]
  TASK["Work in your agent"]
  LOG["Log"]
  DREAM["Dreaming \xB7 daily if scheduled"]
  COUNCIL["Council \xB7 optional second opinion"]
  HOME --> PRIME --> TASK --> LOG --> HOME
  SOURCES -->|"Relevant evidence"| PRIME
  SOURCES -->|"Recent work and due checks"| DREAM
  HOME -->|"Definition and existing records"| DREAM
  DREAM -->|"Verified repairs and useful progress"| HOME
  TASK -.-> COUNCIL
  COUNCIL -.->|"Findings or bounded help"| TASK
\`\`\`

Prime reads what a task needs. Log saves lasting changes at checkpoints. Dreaming checks recent work and selected sources under the same curation rules. Council is optional.

The diagram adapts to the available width. The relationship map above shows the main reading and maintenance paths.

The layers describe responsibilities, not a mandatory sequence. The foundation supplies relevant context for useful AI work. Learning and accepted changes help maintain it. Connected systems retain their originals.

## \u{1F9E9} Content \xB7 optional extension

The same foundation supports a configurable Content extension. The diagram follows the material: idea \u2192 plan/script \u2192 actual original \u2192 reviewed editions \u2192 published outputs \u2192 learning. Setup is the foundation beneath the flow.

<image source="notion-file-block://59fa633d-81d7-433f-8059-76d02b192d6f/dc2e09c1-6252-4c3a-9a99-6ecc529afcca?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=content-material-flow-mobile.png" />

Prepare supports pre-production and creating the actual original. Produce / Distribute covers finishing/post-production, useful adaptations and delivery. Response informs the next idea and configuration. Existing material can enter where it needs help; long and short form are choices. Human judgement, analog work and selected tools remain part of the workflow.

## Editable sources

Current Content material-flow diagrams: wide and mobile PNG/SVG, renderer, palette and SHA-256 manifest.

<file source="notion-file-block://d109739d-6ba8-44f8-81b2-b812755c60fe/b610b8b5-77cf-422b-aef0-c22b3e2122cb?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=content-material-diagrams-20261105.zip" />

The earlier foundation/diagram source packet is retained below for historical reference.

<file source="notion-file-block://45182f44-5e5b-492e-bbc7-8e45307f324b/d88f3e17-5969-4b82-9d2b-675829343422?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=osm-diagrams-20261104.zip">
Four editable SVG diagrams, the renderer, the observed onlinesourdough palette and SHA-256 manifest.
</file>

Colours were read from the public onlinesourdough website on <date start="2026-11-04" />: warm paper, brown text and the brown brand accent. The diagram layout uses clear layers and nested responsibilities, following the Agentic Systems reference.`,source_last_edited:"2026-11-19T21:05:05.955Z"},"40d6d2e17f5681f6accff01259bc2ab4":{id:"40d6d2e17f5681f6accff01259bc2ab4",title:"Releases & documentation",url:"https://gustavanderson.notion.site/40d6d2e17f5681f6accff01259bc2ab4",body:`## Current reference

<synced-block url="https://app.notion.com/p/40d6d2e17f5681f6accff01259bc2ab4#6d01017b2fe949e0ad4548da7e77f404">
<b>Current stable release</b> \xB7 <date start="2026-11-19" />. [OSM v0.33.0](https://github.com/onlinesourdough/OSM-plugin/releases/tag/v0.33.0) resolves to <code>a9a18caf6f0b8193ab970d996e0ef1f1d88a566f</code>. The guide overview, setup walkthrough and architecture diagram point to this release. Use the [tagged source and 20-skill index](https://github.com/onlinesourdough/OSM-plugin/blob/v0.33.0/docs/skills.md) for the current instructions. The legacy Notion skill catalogue and its downloadable packets remain pending reconciliation.

<b>Last fully verified reference source: </b>[<b>OSM v0.30.0</b>](https://github.com/onlinesourdough/OSM-plugin/tree/v0.30.0) \xB7 commit <code>314dcf17a06014df472a32cdb10f847672cba0be</code>.

<b>Catalogue:</b> 22 released OSM references and five adaptable Content templates marked Draft. Content template edition 2026-11-05.1 uses separate version 0.10.0 packets and retains the earlier design files. Content is an optional tailored extension outside the released OSM package. These are adaptable Draft templates, not installed personal skills.

<b>Guide revision 2026-11-05.2 \xB7 5 November 2026.</b> The updated overview, optional Content setup/configuration, five-template library and representative source packet were checked without login. Content template edition 2026-11-05.1 uses version 0.10.0 packets. The tagged OSM source and its 22 released packets remain unchanged.
</synced-block>

The source packets contain the exact released skill directories or explicitly marked draft snapshots, their supporting files, licence and per-file SHA-256 hashes. Released manifests also retain the verified Git blob identities. Each released skill's own version comes from its real <code>metadata.version</code>; it differs from the package version.

Git owns released OSM instructions. Content template packets in Files identify their separate template edition and hashes; they support personal adaptation and are not a released plugin. The readable library preserves the same page identities for links from Resources.

## Installing and updating

Install or update OSM through your agent's plugin system. Then open a fresh conversation and use Setup to check your existing Data & Context home. Your business context stays in your own Notion workspace.

Follow <mention url="https://app.notion.com/p/40d6d2e17f56812bb597fef2bdc1265d">Setup & tools</mention> for the supported installation and access choices.

## Documentation clarification

This guide was clarified on <date start="2026-11-04" />: OSM's data/context hierarchy, its Notion reference setup, concise current-topic maintenance and brand-coloured diagrams. This is a documentation revision, not a new plugin release. Optional metadata guidance does not prove that every installed setup already has those fields. The exact tagged instructions and their source packets remain unchanged.

## Changelog

- <date start="2026-11-05" /> \u2014 guide 2026-11-05.2 and separate Content template edition 2026-11-05.1: optional extension entry, practical database setup, personal configuration, five version 0.10.0 Draft templates with explicit download blocks and material-flow diagrams. Saved-page/attachment readbacks and anonymous guide/library checks passed. The current content-setup packet was downloaded in private browsing and matched its ZIP and per-file SHA-256 hashes. The private foundation parent remained inaccessible. The released OSM source and its 22 reference packets are unchanged. CI/CD publication is separate implementation work under OSM #85 and Factory #122; no live publisher result is claimed.
- <date start="2026-11-04" /> \u2014 guide revision 2026-11-04.1: foundation hierarchy and explanation refined; diagrams rebuilt in the onlinesourdough palette; context lifecycle and metadata guidance clarified. Affected explanations, public diagrams, a released skill reference and the editable diagram download were checked without login. This documentation revision does not change the released package.
- <date start="2026-11-03" /> \u2014 initial reference edition published from the verified v0.30.0 tag. Includes 22 released skill references, five optional Content design snapshots reviewed with Opus 5.5 High, source packets and diagrams. Anonymous access to the overview, supporting pages and representative skill/file was checked.`,source_last_edited:"2026-11-19T21:05:08.534Z"},"40d6d2e17f5681219a81e13317a19339":{id:"40d6d2e17f5681219a81e13317a19339",title:"Content \xB7 optional extension",url:"https://gustavanderson.notion.site/40d6d2e17f5681219a81e13317a19339",body:`Content is a voluntary extension of The Onlinesourdough Method. Use the same business foundation to turn real work, ideas and sources into useful material, relevant editions and learning from the response.

<callout icon="\u{1F4E6}" color="brown_bg">
<b>Shared method and template source:</b> [onlinesourdough/OSM-content](https://github.com/onlinesourdough/OSM-content). Content has its own repository outside the OSM plugin, like a specialized method module. Git owns future shared changes; this Notion section is the readable guide. Your actual configuration, original content and adapted personal Skills stay in your private Data & Context home.

Initial repository import: <date start="2026-11-09" /> \xB7 [commit b8dc567](https://github.com/onlinesourdough/OSM-content/commit/b8dc567). The five existing v0.10.0 Draft templates are preserved unchanged with file hashes. No new OSM package, editor qualification or personal installation is implied.

Next shared improvements: [writing-voice calibration](https://github.com/onlinesourdough/OSM-content/issues/1) and [source-to-guide maintenance](https://github.com/onlinesourdough/OSM-content/issues/2). These are tracked work, not delivered capabilities.
</callout>

<callout icon="\u{1F9E9}" color="brown_bg">
<b>Add the Content extension.</b> Start from an existing OSM foundation, map or create its Content collection, choose a workable configuration and adapt the useful skill templates into your own Skills. This is a method and starter kit to tailor, not a preinstalled universal Content plugin.
</callout>

## Start here

<columns>
<column ratio="50">
### \u{1F9F1} Set up the foundation

<page url="https://app.notion.com/p/40f6d2e17f56819ea683f45a30072086">
Content setup & database
</page>

Record types, properties, useful views, media locations and a repeatable setup check.
</column>
<column ratio="50">
### \u{1F39B}\uFE0F Make it yours

<page url="https://app.notion.com/p/40f6d2e17f5681d68525d83503a457d5">
Personal configuration
</page>

Goals, creative process, channels, tools, personal skills and optional automation.
</column>
</columns>

## Give this page to your agent

\`\`\`txt
Use this Content extension to set up or adapt my content workflow. Read the Setup & database contract and Personal configuration pages linked here. My existing Data & Context entry is: [give the agent your own private entry link].

Read my selected operating policy and relevant goals, audience, voice and preferences. Inspect the actual existing content collection, personal skills, integrations and media locations. Reuse what works. Map the schema and missing choices; create only the authorized missing structure. Adapt useful templates into my personal Skills, with actual configuration and references. Verify one bounded capture/material handoff and replay without duplicates. Keep publication and schedules within their existing authority. Report what is ready and what is unresolved.
\`\`\`

The public guide supplies the method. Your private entry supplies your routes, business context and authority. An agent with no access can explain the plan and name the exact access gap; it must not search another account or invent a successful setup. Read the linked details progressively rather than loading the entire OSM library.

Already using OSM? Find your entry through the context-home link saved during onboarding, your OSM Home/navigation or the host's short OSM instruction pointer. The entry selects the exact Operating policy (the owner's read/write and source rules); read that selection instead of searching for every page called Policy. <mention url="https://app.notion.com/p/40d6d2e17f56812bb597fef2bdc1265d">Setup & tools</mention> explains the core setup. For one small content task, read the existing entry/configuration and inspect only the missing schema/key/integration details; do not restart onboarding.

## How the material changes

<image source="notion-file-block://00b75561-a948-4aa2-97c6-65d27c25e9bb/b400c046-3a4b-40ca-abef-0544a95002f4?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=content-material-flow.png" />

<toggle>
For smaller screens

<image source="notion-file-block://9e26ad2b-0493-4a9c-be2d-ffa964122e8d/dc2e09c1-6252-4c3a-9a99-6ecc529afcca?space_id=eee27a39-7e8a-48e6-9bd4-f3bc51a333fe&name=content-material-flow-mobile.png" />
</toggle>

An idea becomes a brief or script, then actual written/recorded/visual material, reviewed editions and verified public outputs. Response becomes useful learning for the next round. Setup is the supporting foundation, not a step repeated for each piece. Prepare covers pre-production and support while creating the original; Produce / Distribute covers finishing/post-production, adaptations and delivery. The five responsibilities describe who helps; the material moves through more than five states.

| Responsibility | Useful result |
| --- | --- |
| Setup | A reused or new Content collection, actual field map and accepted workflow choices |
| Intake | Preserved ideas/sources, why they matter and possible angles |
| Prepare | Brief, writing draft, script or recording plan and support creating actual material |
| Produce / Distribute | Finished originals, useful editions, review and selected verified delivery |
| Learn | Dated observations against the chosen goal and one useful next experiment |

Enter where the material needs help. A plan is not footage, a reviewed edition is not publication, and a newsletter can be an original or a synthesis. Good short ideas may stand alone. Preserve human taste, analog work and suitable existing editors.

## \u{1F9F0} Personal skill templates

The five templates below are adaptable starting instructions with supporting files. They mirror the method; they are not your personal configuration or a released OSM package. Use an existing suitable skill instead of creating a duplicate. You can adopt one responsibility or several.

- <mention url="https://app.notion.com/p/40d6d2e17f5681c99020d85e3bc1ff4b">content-intake</mention>
- <mention url="https://app.notion.com/p/40d6d2e17f5681c784c4d545814fd7a5">content-learn</mention>
- <mention url="https://app.notion.com/p/40d6d2e17f568141a2c9efa2d04c9268">content-prepare</mention>
- <mention url="https://app.notion.com/p/40d6d2e17f568122aa82f1dcf83500a7">content-produce</mention>
- <mention url="https://app.notion.com/p/40d6d2e17f5681578925cdc0774c6db5">content-setup</mention>

The filtered library at the bottom shows the same five records as the main catalogue, not another editable copy. Current template packets identify their revision and hashes; earlier v0.7 packets remain history. A template page being visible does not mean it is installed, enabled or exercised in your agent.

## What belongs where

Knowledge owns current business goals, audience, offers, voice and working preferences. Content owns sources, ideas/productions, editions and concrete response. Personal Skills implement your chosen workflow. Media and editor projects can live outside Notion at mapped, accessible locations; a Notion link is not a backup. The subscriber system owns live subscriptions and unsubscribes. OSM upkeep keeps the selected foundation current, including an existing Content collection. Content Learn evaluates editorial fit and contribution to goals. Neither automatically starts a production schedule or sends a newsletter.

## Tools and status

Notion editorial work and Kit newsletter distribution are a starter recipe. HyperFrames remains a video candidate: practical import/edit/save-reopen/export qualification is still required. Keep suitable existing tools.

The core OSM reference catalogue continues to describe its exact tagged source, including any earlier bundled Content helpers at that version. This separate template edition does not claim a new OSM release, editor qualification, personal adoption or completed content production.

<section id="flow"><h1>OSM in your agent\u2019s workspace</h1><p class="intro">OSM is the context module in your agent system. Your agent uses your business knowledge, working methods and connected sources to do useful work.</p>
<div class="setup"><strong>Setup</strong><span>Connect Notion, create or select your Data & Context home and add the short instructions to your agent.</span><b aria-hidden="true">\u2193</b></div><div class="work"><div class="label">Your agent app \xB7 tools, models and permissions</div><div class="route"><div class="node"><h2>Prime</h2><p>Find the context this task needs.</p></div><span class="arrow" aria-hidden="true">\u2192</span><div class="node core"><h2>Your work</h2><p>Use relevant context, tools and sources.<br>Complete the task in your agent\u2019s workspace.</p></div><span class="arrow" aria-hidden="true">\u2192</span><div class="node"><h2>Log</h2><p>Save permitted lasting decisions and corrections.</p></div></div><div class="helpers"><div><strong>Interview</strong><span>Explore the goal when needed.</span></div><div><strong>Human Writing</strong><span>Write for the reader and the author\u2019s voice.</span></div><div><strong>Council</strong><span>Ask another agent to review or do bounded work.</span></div></div></div>
<div class="linkrow"><span>Read the definition and relevant records</span><span>Update the right record and read it back</span></div>
<div class="home"><h2>Notion \xB7 Data & Context</h2><p class="definition">The root starts with your business\u2019s Data & Context definition: which systems to use, how to reach them, and what may be processed or stored where. The databases follow below.</p><div class="stores"><div class="store"><strong>Knowledge</strong><p>Your business, offers, customers, voice and current understanding.</p></div><div class="store"><strong>Memory</strong><p>Lasting decisions, corrections and the reasons behind them.</p></div><div class="store"><strong>Skills</strong><p>Your own reusable ways of working.</p></div></div><p class="optional"><strong>Content \xB7 optional</strong> A database or links for your content work, when useful. Your definition can also point to other databases and systems.</p></div>
<div class="lower"><div class="sources"><h2>Data & connected sources</h2><p>Numina, CRM, files, messages and other systems keep their originals. Query them directly through approved tools. Source-only records stay there; a Notion mirror or importer is unnecessary.</p></div><div class="dream"><h2>Dreaming</h2><p>Between sessions, review completed, unfinished and archived work. Recover missed learning, consolidate Memory, maintain the definition and repair verified mistakes without duplicating records.</p><p class="flow">Work + selected sources \u2192 review \u2192 maintained context</p></div></div><p class="foot">Setup configures the definition for your business. Access, permitted processing and retention are separate source rules. A daily Dreaming run uses a schedule selected in the host.</p></section>

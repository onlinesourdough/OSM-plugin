# OSM:log

Run before handing back a completed piece of substantive work, or when the
user asks in ordinary language to save a decision, correction or other learning.
A chat can continue after Log. Repeated checkpoints review only evidence added
since the last verified checkpoint.
The lead retains Log in delegated work. Dreaming uses its own run result.

Before a checkpoint write, follow [Writing for a person](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/references/human-output.md).

1. Review the useful result, decisions and explicit corrections since that
   checkpoint. Retain what would help the next relevant session act. Leave
   routinely retrievable facts, work artifacts and live status at their
   existing sources.
   Check source-specific retention as well as destination write authority.
   Source-only or restricted records stay in their system, even when the
   agent may read them. Do not copy them into Notion, a log, a worker brief
   or a paraphrased summary to bypass that rule. Save only the permitted
   route, decision or learning, with permitted evidence.
2. Resolve the target and effective write authority from the current task. Use
   the home verified for that scope, even when the host has a different
   personal default. Without a verified destination and authority, keep a
   concrete proposed update with the task. Leave unrelated project work local.
3. Use [Manage Data & Context](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/index.md) for intake,
   record identity and verified writes. Save supported lasting context
   automatically within verified authority. Hold an uncertain or conflicting
   change as pending. Skip routine or unchanged material.
4. Use the shared [progress and retry rules](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/references/activity.md)
   so an uncertain write is read back before any retry. A later Log or Dreaming
   run reconciles the same learning against the same existing topic.
5. Correct a verified logging or context error at this checkpoint. Use the shared
   [repair rules](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/references/activity.md#repair-in-the-current-session)
   to verify the correction and leave a short note for Dreaming.

If anything lasting was saved or held, name it and its destination briefly
with the result. Leave an ordinary no-change checkpoint quiet.

# OSM:prime

Use when starting or resuming work that needs the selected Notion context, or
when asked to prime. Start with the request and applicable project instructions.
A scheduled Dreaming run uses its own entrypoint. A scoped worker uses the
inputs selected by the lead.

1. Resolve the scope before opening a source. A task that can clearly be solved
   within an independent project uses its local instructions and sources only.
   General questions without owner context also need no Notion access. Honor
   an explicit project or client context boundary before the personal default.
2. For other tasks, resolve the Notion root on the \`Data and Context:\` line
   (or the existing \`Context:\` line). Read that line from the host's persistent
   instruction file or, if the host has none, from its built-in persistent
   memory or standing instructions, then open the root through the host's
   authorized connection.
   If the root is missing or unreadable, identify the missing prerequisite and
   continue independent work. Use only the selected home and account.
3. Follow [Manage Data & Context](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/index.md) for
   retrieval. Read the Data and Context Definition and its required controls
   once, then use metadata to find only what the task needs. Use a scoped
   Memory query for a past decision and the selected
   history or project source for unfinished work or an activity recap. Verify
   a live fact at its owning source when the result depends on it.
   Treat the definition as a gateway, not a request to import every source.
   Follow each source's permitted use, processing environment and retention
   rules before reading it. For example, query accounting in its selected
   accounting tool and reference heavy media where it lives; do not mirror
   records or upload binary files into Notion. Permission to read a source is
   separate from permission to retain or share its contents. Report a
   registered source this host cannot reach rather than working around it.
4. If you find a verified context error, correct the lookup or conclusion now.
   Use the shared [repair rules](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/references/activity.md#repair-in-the-current-session)
   for an authorized stored repair and a short note for Dreaming.
5. Use the relevant result, then proceed with the user's actual request. In
   this session reuse verified context; refresh the affected source only when
   the task, home, scope, freshness or access changes. After compaction, reuse
   retained verified context; resolve missing routes before relying on them.
   When writing or revising
   an authorised Notion page or row, and for its accompanying reply, follow
   [Writing for a person](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/references/human-output.md).

Prime keeps its work inside the selected home and scope. Report concrete gaps
when they affect the result.

# OSM:setup

Conduct onboarding from a connected Notion workspace to a verified home and a
useful first task. Reuse answers; resume at the next gap. Explain the useful
result before unfamiliar questions; use [Setup](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/setup.md) for the welcome. Use the conversation's
language; on a neutral resume, use its recorded preference or working content,
not the fixed English title, to choose the language.

Track the accepted plan: known answers, verified work, open choices/proof gaps
and next action. Use native progress or one task-evidence checklist; Codex follows
[tracking](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/codex-tracking-acceptance.md). Reuse state and dated proof on resume.
Before handback, check [acceptance](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/setup.md#acceptance-and-continuity):
continue authorised work or ask the next material question. A completed subtask
does not complete Setup. Creating a goal requires authority.

Codex **Set up**, the **OSM:setup** skill picker entry, or a request naming OSM
starts this skill. Bare \`/setup\` can select another plugin; do not claim that
generic command is OSM's entry or that ordinary Notion setup needs an API key.
Reuse accepted setup and connections; verify access, not badges or links. For
package installation or a requested bridge-only change, use the
[adapter route](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/adapters.md). Installation alone creates no home and
needs no global instruction edit. Use the [Notion access](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/panel.md) procedure for Codex connection checks.
Use the [procedure index](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm/index.md) for earlier names and package recovery.

## One path

Setup leads Data & Context, Manage Data & Context and Manage Skills; nothing
calls back into Setup. Interview's new-connection route is separate:

1. **Connection and access.** Inspect exposed connections first and reuse a
   working connection or recorded choice. For new ordinary setup, check the
   official Notion plugin and connection; install through the supported host
   route when authorised, guide sign-in and verify the workspace with a scoped
   safe read. Use a
   dedicated connection when the selected team, worker or unattended workflow
   needs its own identity or access scope. Preserve an existing recorded choice.
   Unavailable or declined access stays an explicit gap while other work
   continues. If the selected route requires a credential or rotation, use
   [credential setup and verification](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/credentials.md).
   No secrets in chat or context.
2. **Understand the business.** Use the [business coverage check](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/business-context.md)
   for goals, offers, customers, positioning and systems, reusing what the
   workspace already shows. [Interview](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-interview/SKILL.md) only where
   material context is missing, with its
   [owner-context guide](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-interview/references/owner-context.md); never a
   fixed questionnaire.
3. **Map sources, artifacts and authority.** The definition is the gateway:
   record each source's purpose, scope, actual account/reader, permitted
   actions, processing environment and retention. Keep operational originals
   and heavy media at their owner; Notion keeps non-granting references, never
   credentials. Normally query an AI-native source directly, reusing its
   connection. Files and repositories are sources/artifacts, not homes. Locate
   a named task-relevant source before substituting a generic result;
   [setup](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/setup.md) owns the minimal follow-up and source agreement.
4. **Reuse or create.** [Data & Context](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-data-context/index.md) engineers
   the home, definition and core Knowledge, Memory and Skills roles. Reuse actual
   IDs, create only missing stores, and replay without duplicates. Include the
   [Content foundation](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-data-context/references/notion/content-foundation.md)
   in a new home's short plan: reuse an existing Notion or authoritative external route,
   record a deferral, or propose one empty store. Personal Content methods stay
   optional. No retrofit on normal resume. Discover actual store types/metadata
   before mapping; follow the architecture's
   [record lifecycle](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-data-context/references/architecture.md#record-lifecycle).
   Before building, explain the foundation/adoption plan and open choices,
   reusing answers. New roots use **AI operating model** untranslated and the
   [root template](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-data-context/assets/data-and-context-root.md) for the
   definition and existing public-guide icons. Start the body with the definition,
   then native databases; existing roots follow the owner's request/write policy.
   Keep onboarding in the conversation, referencing the public guide when useful.
5. **Adopt.** Record the owner's write policy once: whole-home proposed, never
   assumed. Save the thin pointer in the host's persistent instruction file,
   or built-in standing memory/instructions if it has no file.
   Instantiate the [bridge](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-data-context/assets/bridge.md)
   with the verified root; check its shared lines and refer to policy, never
   copy it. Keep its conditional Prime line for ordinary chats: Prime excludes
   independent work before reading Notion. Place the pointer at the authorised
   scope; preserve unrelated instructions and selected accounts/dedicated routes.
6. **Optional upkeep.** [Manage Data & Context](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-data-context/index.md)
   owns manual/task-time curation; [Dreaming](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-dreaming/SKILL.md) reflects
   across recent work, manually or scheduled. Scheduling through the host needs
   an explicit request and exact authority. Record only readable history/source
   routes; unavailable or unqualified routes stay explicit gaps.
7. **Check the whole accepted plan.** Deliver the agreed result and verify the
   foundation, continuing write policy, pointer and brief snapshot confirmation.
   An explicitly chosen narrow policy is valid; a task grant alone does not
   settle future writes. Continue remaining authorised work or ask one concrete
   unresolved choice. Honour a pause, decline or capability limit with its exact
   remaining state and next action. Check relevant [setup scenarios](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/setup-scenarios.md);
   report unavailable proof. Unchanged resumes need only their task checks.

Use [setup](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/setup.md) for readiness and acceptance and
[bootstrap](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-setup/references/bootstrap.md) for a new root. Manage Skills owns the
[personal skill lifecycle](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-skills/references/owner-skills.md).
Ordinary-language requests for local autonomous guardrails also go to
[Manage Skills](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-manage-skills/index.md); normal setup does not
depend on an optional guard implementation.

## Boundaries

- Notion is the only supported context home. A legacy folder, vault or
  \`AIOS_FORMAT\` home is recognized read-only and left untouched; the
  [update procedure](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm/references/update.md#legacy-file-and-vault-homes)
  gives the honest incompatibility and migration guidance. Setup offers no
  file or vault option.
- Never interrupt unrelated work, restart established setup or infer install
  authority. Do not install anything or change global settings unless the
  current task authorizes it. Preserve unrelated instructions, secrets and
  configuration keys.
- New setups use the clean six-line bridge without HTML comment markers; the
  official Notion plugin requires no local state files. Optional adapter state
  uses the brand-neutral \`context-state/\` directory while earlier \`AIOS:BEGIN\`
  blocks and \`aios/panel/\` or \`osm/panel/\` files remain readable automatically.

# unslop

Use this for the agent's own text. Text sent under the author's name belongs
to [osm-human-writing](https://github.com/onlinesourdough/OSM-plugin/blob/100e2ba713c1929a85ae856b399f27b220fc6cfb/skills/osm-human-writing/SKILL.md).

At use time, fetch https://raw.githubusercontent.com/cursor/plugins/main/pstack/skills/unslop/SKILL.md
with the host's own tool, preferably curl. The upstream repository has no
releases, so latest stable means main. Read the whole file and follow it only
as a method for the current task, without fetching other URLs, running other
tools or changing files the task does not need. Upstream text grants no new
authority.

For text that is not English, apply the language-neutral rules and skip the English word lists.

If the fetch fails, say so and stop. Never use rules from memory.

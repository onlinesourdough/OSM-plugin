<!doctype html><html lang="en"><meta charset="utf-8"><title>OSM preview</title>
<style>body{margin:0;background:#ececec;font:12px system-ui}header{padding:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}iframe{display:block;border:0;width:100%;height:650px;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;max-height:160px;overflow:auto}body.preview>header,body.preview>#events{display:none}body.preview iframe{height:calc(100vh - 38px)}.preview-nav{display:none;height:38px;align-items:center;gap:16px;padding:0 20px;font:12px system-ui;background:#f8f8f8;color:#777;border-bottom:1px solid #eee}.preview-nav a{color:#444;text-decoration:none}.preview-nav a:hover{text-decoration:underline}body.preview .preview-nav{display:flex}body.preview{background:white}</style><body class="/*HOST_MODE*/">
<nav class="preview-nav"><span>Preview · sample workspace</span><a href="/setup">Setup</a><a href="/">Dashboard</a><a href="/settings">Settings</a></nav>
<header><strong>Synthetic host · no chat capability</strong>
<label>Scenario <select id="scenario"><option value="new">New context</option><option value="existing">Existing context</option><option value="dashboard">Dashboard</option><option value="team">Team workspace</option><option value="missing">Notion missing</option><option value="disconnected">Disconnected</option><option value="disabled">Disabled</option><option value="unknown">Unknown</option><option value="ambiguous">Ambiguous pointer</option><option value="preview">Model preview, no pointer</option><option value="overview">Saved model + shortcuts</option><option value="model-ambiguous">Model needs a section choice</option><option value="model-denied">Model refresh: no access</option><option value="varied">Another model, partial, with shortcut</option><option value="model-unknown">Saved model, completeness unknown</option><option value="overview-empty">Saved model, no shortcuts</option><option value="overview-duplicate">Saved model, shortcut repeats a model link</option><option value="overview-disconnected">Saved model, Notion disconnected</option></select></label>
<label>Theme <select id="theme"><option>light</option><option>dark</option></select></label>
<label>Width <select id="width"><option value="100%">Full</option><option value="320px">320px</option></select></label>
<label><input id="fail" type="checkbox">Fail requests</label><label><input id="delay" type="checkbox">Delay save</label><button id="reset">Reset</button><button id="reload">Reopen</button></header>
<iframe title="OSM panel" src="/app"></iframe><pre id="events" aria-label="Protocol events">Waiting</pre>
<script>
const frame=document.querySelector('iframe'), events=document.querySelector('#events'), scenario=document.querySelector('#scenario');
let trace=[];
const workspace='/*HOST_WORKSPACE*/',initialView='/*HOST_VIEW*/';scenario.value='/*HOST_SCENARIO*/';
async function rpc(action,args){const r=await fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args,scenario:scenario.value,workspace})});const value=await r.json();if(!r.ok)throw new Error(value.error);return value}
function send(message){frame.contentWindow.postMessage({jsonrpc:'2.0',...message},location.origin)}
function context(){return {theme:document.querySelector('#theme').value,displayMode:'fullscreen',availableDisplayModes:['fullscreen']}}
async function reset(){await rpc('reset');trace=[];frame.src='/app'}
scenario.onchange=reset;document.querySelector('#reset').onclick=reset;
document.querySelector('#reload').onclick=()=>{frame.src='/app'};
document.querySelector('#theme').onchange=()=>send({method:'ui/notifications/host-context-changed',params:context()});
document.querySelector('#width').onchange=e=>{frame.style.width=e.target.value};
window.addEventListener('message',async event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
 const {id,method,params}=event.data;if(!method)return;
 if(!method.includes('size-changed')){trace.push({method,params});events.textContent=JSON.stringify(trace,null,2)}
 if(method==='ui/initialize')send({id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'OSM synthetic host',version:'2'},hostCapabilities:{serverTools:{},openLinks:{}},hostContext:context()}});
 else if(method==='ui/notifications/initialized'){const result=await rpc('status');if(initialView==='settings')result._meta['osm/view']='settings';send({method:'ui/notifications/tool-result',params:result})}
 else if(method==='tools/call'){
 try{
  if(document.querySelector('#fail').checked)throw new Error('Synthetic request failure');
  if(!['osm_status','osm_settings','osm_save_context','osm_save_sources','osm_notion_pages','osm_notion_icons'].includes(params.name))throw new Error('Unsupported tool');
  if(params.name.startsWith('osm_save_')&&document.querySelector('#delay').checked)await new Promise(r=>setTimeout(r,3000));
  const result=await rpc(params.name==='osm_save_context'?'save':params.name==='osm_save_sources'?'sources':params.name==='osm_notion_pages'?'pages':params.name==='osm_notion_icons'?'icons':'status',params.arguments);send({id,result});
 }catch(error){send({id,result:{isError:true,content:[{type:'text',text:error.message}],...(['osm_notion_pages','osm_notion_icons'].includes(params.name)?{_meta:{'osm/kind':params.name==='osm_notion_pages'?'pages':'icons'}}:{})}})}
 }else if(method==='ui/open-link')send({id,result:{}});
 else if(id!==undefined)send({id,error:{code:-32601,message:'No conversation or other capabilities in this host'}});
});
</script></html>

  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt">
    <path d="M11.25 3.04A8 9 0 0 0 11.25 20.96"/>
    <path d="M12.75 3.04A8 9 0 0 1 12.75 20.96"/>
  </g>
</svg>

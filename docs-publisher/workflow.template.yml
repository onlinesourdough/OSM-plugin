# INACTIVE TEMPLATE. Do not copy into .github/workflows until every item in ACTIVATION.md is done.
# It is outside .github/workflows on purpose: nothing here runs, and nothing was enabled by merging it.
# One trigger, no schedule. The publishing stage is serialized by the concurrency group below and by
# the publisher's own run claim; one public writer per artifact is what actually prevents a collision.
name: Publish documentation projection

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'skills/**'
      - 'docs-publisher/manifest.json'

permissions:
  contents: read

concurrency:
  group: osm-documentation-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Credential-free reconciliation (always runs, writes nothing)
        run: python3 docs-publisher/publisher.py reconcile --ref "$GITHUB_SHA" --base "${{ github.event.before }}" --out reconciliation.md --check
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-reconciliation
          path: reconciliation.md
      - name: Publish CI-owned rows (fails closed without the dedicated credential)
        env:
          OSM_PUBLIC_DOCS_TOKEN: ${{ secrets.OSM_PUBLIC_DOCS_TOKEN }}
        run: python3 docs-publisher/publisher.py publish --ref "$GITHUB_SHA" --database "${{ vars.OSM_PUBLIC_DOCS_DATABASE }}" --public-base "${{ vars.OSM_PUBLIC_DOCS_BASE }}"
